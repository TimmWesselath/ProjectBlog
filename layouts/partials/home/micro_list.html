{{- $title := .title -}}
{{- $items := .items -}}

<h2>{{- $title -}}</h2>
<div class="flat-list">
  {{- range first (default 5 site.Params.rtwt.home.countRecent) $items -}}
    <div class="flat-list-item">
      <div>
        <a href="{{- .RelPermalink -}}">{{- .LinkTitle -}}</a>
        <time class="text-sm dim" style="float: right;" datetime="{{ .Date.Format "2006-01-02" }}">
          {{- .Date | time.Format ":date_long" -}}
        </time>
      </div>
      <small><p>{{- partial "components/summary.html" . -}}</p></small>
    </div>
  {{- end -}}
</div>
