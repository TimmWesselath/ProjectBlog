# Pages CMS configuration (https://pagescms.org)
# Defines what you can edit in the browser editor.

media:
  input: static/images
  output: /images

content:
  - name: posts_en
    label: "Posts (English)"
    type: collection
    path: content/en/posts
    exclude: [_index.md]
    filename:
      template: "{fields.translationKey}.md"
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields: &postfields
      - name: title
        label: Title
        type: string
        required: true
      - name: translationKey
        label: "Post ID: same in English and German, lowercase with dashes (e.g. my-first-post). Becomes the web address."
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Only lowercase letters, numbers and dashes"
      - name: date
        label: Date
        type: date
        required: true
      - name: description
        label: "Short summary (shown in the post list)"
        type: text
      - name: draft
        label: "Draft (not published while checked)"
        type: boolean
        default: false
      - name: featured
        label: "Featured (pinned at the top of the home page)"
        type: boolean
        default: false
      - name: body
        label: Text
        type: rich-text

  - name: posts_de
    label: "Beiträge (Deutsch)"
    type: collection
    path: content/de/posts
    exclude: [_index.md]
    filename:
      template: "{fields.translationKey}.md"
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields: *postfields

  - name: about_en
    label: "About (English)"
    type: file
    path: content/en/about.md
    fields: &pagefields
      - { name: title, label: Title, type: string, required: true }
      - { name: body, label: Text, type: rich-text }

  - name: about_de
    label: "Über (Deutsch)"
    type: file
    path: content/de/about.md
    fields: *pagefields

  - name: contact_en
    label: "Contact page text (English)"
    type: file
    path: content/en/contact.md
    fields: *pagefields

  - name: contact_de
    label: "Kontaktseite Text (Deutsch)"
    type: file
    path: content/de/contact.md
    fields: *pagefields

  - name: impressum_de
    label: "Impressum (Deutsch)"
    type: file
    path: content/de/impressum.md
    fields: *pagefields

  - name: impressum_en
    label: "Imprint (English)"
    type: file
    path: content/en/impressum.md
    fields: *pagefields

  - name: privacy_de
    label: "Datenschutzerklärung (Deutsch)"
    type: file
    path: content/de/privacy.md
    fields: *pagefields

  - name: privacy_en
    label: "Privacy Policy (English)"
    type: file
    path: content/en/privacy.md
    fields: *pagefields
